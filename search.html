<script>
  // Simple HTML escape to prevent XSS from user-controlled values
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Get query from URL (raw for display, lowercased for matching)
  const params = new URLSearchParams(window.location.search);
  const rawQuery = params.get("q") || "";
  const query = rawQuery.toLowerCase().trim();

  const resultsDiv = document.getElementById("results");

  if (!query) {
    // No user input echoed as HTML
    resultsDiv.textContent = "No search term entered.";
  } else {
    const results = searchIndex.filter(item =>
      item.title.toLowerCase().includes(query) ||
      item.keywords.toLowerCase().includes(query)
    );

    if (results.length === 0) {
      // Escape user input before inserting into innerHTML
      resultsDiv.innerHTML = `<p>No results found for "<strong>${escapeHTML(rawQuery)}</strong>".</p>`;
    } else {
      // Escape any text that is rendered, even though it comes from static data
      resultsDiv.innerHTML = results.map(r =>
        `<div class="season">
          <h3>${escapeHTML(r.title)}</h3>
          <p><strong>Category:</strong> ${escapeHTML(r.category)}</p>
          <p><a href="${r.url}">Visit Page</a></p>
        </div>`
      ).join("");
    }
  }
</script>
